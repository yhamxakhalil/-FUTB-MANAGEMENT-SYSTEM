{% extends "base.html" %}
{% block title %}Change Password{% endblock %}
{% block content %}
<h3 class="mb-3"><i class="fa-solid fa-key"></i> Change Password</h3>
<div class="card" style="max-width: 460px;">
  <div class="card-body">
    <form method="POST">
      <div class="mb-3">
        <label class="form-label">Current Password</label>
        <input type="password" name="current_password" class="form-control" required autofocus>
      </div>
      <div class="mb-3">
        <label class="form-label">New Password</label>
        <input type="password" name="new_password" class="form-control" minlength="6" required>
        <div class="form-text">At least 6 characters.</div>
      </div>
      <div class="mb-3">
        <label class="form-label">Confirm New Password</label>
        <input type="password" name="confirm_password" class="form-control" minlength="6" required>
      </div>
      <button type="submit" class="btn btn-primary"><i class="fa-solid fa-check"></i> Update Password</button>
      <a href="{{ url_for('auth.after_login_redirect') }}" class="btn btn-outline-secondary">Cancel</a>
    </form>
  </div>
</div>
{% endblock %}
