{% extends "base.html" %}
{% block title %}Add Lecturer{% endblock %}
{% block content %}
<h3 class="mb-3"><i class="fa-solid fa-user-plus"></i> Add Lecturer</h3>
<div class="card" style="max-width: 560px;">
  <div class="card-body">
    <form method="POST">
      <div class="mb-3">
        <label class="form-label">Full Name</label>
        <input type="text" name="name" class="form-control" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Email</label>
        <input type="email" name="email" class="form-control" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Phone</label>
        <input type="text" name="phone" class="form-control">
      </div>
      <hr>
      <p class="text-muted small">Login credentials for this lecturer:</p>
      <div class="mb-3">
        <label class="form-label">Username</label>
        <input type="text" name="username" class="form-control" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Password</label>
        <input type="text" name="password" class="form-control" placeholder="Defaults to 'lecturer123' if left blank">
      </div>
      <button type="submit" class="btn btn-primary"><i class="fa-solid fa-check"></i> Add Lecturer</button>
      <a href="{{ url_for('admin.lecturers') }}" class="btn btn-outline-secondary">Cancel</a>
    </form>
  </div>
</div>
{% endblock %}
