{% extends "base.html" %}
{% block title %}Edit Course{% endblock %}
{% block content %}
<h3 class="mb-3"><i class="fa-solid fa-pen-to-square"></i> Edit Course - {{ course.code }}</h3>
<div class="card" style="max-width: 560px;">
  <div class="card-body">
    <form method="POST">
      <div class="mb-3">
        <label class="form-label">Course Code</label>
        <input type="text" class="form-control" value="{{ course.code }}" disabled>
      </div>
      <div class="mb-3">
        <label class="form-label">Course Title</label>
        <input type="text" name="title" class="form-control" value="{{ course.title }}" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Level</label>
        <select name="level" class="form-select">
          {% for level in [100, 200, 300, 400] %}
          <option value="{{ level }}" {{ 'selected' if course.level == level }}>{{ level }} Level</option>
          {% endfor %}
        </select>
      </div>
      <div class="mb-3">
        <label class="form-label">Semester</label>
        <select name="semester_id" class="form-select">
          {% for semester in semesters %}
          <option value="{{ semester.id }}" {{ 'selected' if course.semester_id == semester.id }}>{{ semester.name }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="mb-3">
        <label class="form-label">Credit Unit</label>
        <input type="number" name="credit_unit" class="form-control" value="{{ course.credit_unit }}" min="1" max="10" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Course Type</label>
        <select name="course_type" class="form-select">
          {% for ctype in ['Core', 'Elective', 'General'] %}
          <option value="{{ ctype }}" {{ 'selected' if course.course_type == ctype }}>{{ ctype }}</option>
          {% endfor %}
        </select>
      </div>
      <button type="submit" class="btn btn-primary"><i class="fa-solid fa-check"></i> Save Changes</button>
      <a href="{{ url_for('admin.courses') }}" class="btn btn-outline-secondary">Cancel</a>
    </form>
  </div>
</div>
{% endblock %}
