{% extends "base.html" %}
{% block title %}Add Student{% endblock %}
{% block content %}
<h3 class="mb-3"><i class="fa-solid fa-user-plus"></i> Add Student</h3>
<div class="card" style="max-width: 560px;">
  <div class="card-body">
    <form method="POST">
      <div class="mb-3">
        <label class="form-label">Full Name</label>
        <input type="text" name="full_name" class="form-control" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Registration Number</label>
        <input type="text" name="reg_number" class="form-control" placeholder="e.g. SIT/SWE/23/0024" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Level</label>
        <select name="level" class="form-select" required>
          {% for level in [100, 200, 300, 400] %}
          <option value="{{ level }}">{{ level }} Level</option>
          {% endfor %}
        </select>
      </div>
      <div class="mb-3">
        <label class="form-label">Academic Session</label>
        <select name="academic_session_id" class="form-select">
          {% for s in sessions %}
          <option value="{{ s.id }}" {{ 'selected' if current_session and s.id == current_session.id }}>{{ s.name }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="mb-3">
        <label class="form-label">Email</label>
        <input type="email" name="email" class="form-control">
      </div>
      <hr>
      <p class="text-muted small">The student logs in with their registration number and this password. They can change it after logging in.</p>
      <div class="mb-3">
        <label class="form-label">Initial Password</label>
        <input type="text" name="password" class="form-control" placeholder="Defaults to 'student123' if left blank">
      </div>
      <button type="submit" class="btn btn-primary"><i class="fa-solid fa-check"></i> Add Student</button>
      <a href="{{ url_for('admin.students') }}" class="btn btn-outline-secondary">Cancel</a>
    </form>
  </div>
</div>
{% endblock %}
