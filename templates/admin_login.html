{% extends "base.html" %}
{% block title %}Admin Sign In{% endblock %}
{% block content %}
<h2>Admin Sign In</h2>
<form method="POST">
    <label>Username</label>
    <input type="text" name="username" required>

    <label>Password</label>
    <input type="password" name="password" required>

    <button type="submit">Sign in</button>
</form>
{% endblock %}
